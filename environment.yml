name: lie_neuro
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  # PyTorch with CUDA 12.4 (compatible with driver 590 / CUDA 12.8)
  - pytorch>=2.4.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4
  # Scientific computing
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  # Progress bars & utilities
  - tqdm
  - pip:
    # HuggingFace stack
    - transformers>=4.45.0
    - accelerate>=0.34.0
    - datasets>=2.20.0
    - huggingface_hub>=0.24.0
    # Tokenizers & sentence embeddings (for evaluation)
    - sentencepiece
    - protobuf
    # Experiment tracking
    - wandb
    # Plotting
    - matplotlib>=3.8
    - seaborn>=0.13
    # Utilities
    - einops
    - jsonlines
    - rich           # pretty terminal output
    - pyyaml
